<!doctype html>
<html lang="ko">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f6f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: #1c1c22;
    "
  >
    <table
      role="presentation"
      width="100%"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px"
    >
      <tr>
        <td>
          <p style="margin: 0 0 8px; font-size: 20px; font-weight: 700">gymjjim 직원 초대</p>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6">
            센터 관리자 계정에 초대되었어요. 아래 버튼을 눌러 비밀번호를 정하면 바로 시작할 수 있어요.
          </p>
          <a
            href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=invite"
            style="
              display: inline-block;
              padding: 14px 24px;
              background: #4f46e5;
              color: #ffffff;
              border-radius: 12px;
              font-size: 16px;
              font-weight: 600;
              text-decoration: none;
            "
            >초대 수락하기</a
          >
          <p style="margin: 24px 0 0; font-size: 13px; color: #6b6b76; line-height: 1.6">
            링크는 1시간 동안만 쓸 수 있어요. 만료되면 대표에게 다시 초대를 요청해 주세요.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
